<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truco Paulista 6 Jogadores</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- TELA DE LOBBY / ENTRADA -->
  <div id="lobby-screen" class="lobby-container">
    <div class="lobby-card">
      <h1>🎴 Truco Paulista (6 Jogadores)</h1>

      <div class="input-group">
        <label for="player-name">Seu Nome:</label>
        <input type="text" id="player-name" placeholder="Ex: Mari" />
      </div>

      <div class="input-group">
        <label for="team-select">Escolha seu Trio:</label>
        <select id="team-select">
          <option value="A">Trio A</option>
          <option value="B">Trio B</option>
        </select>
      </div>

      <div class="input-group">
        <label for="room-code">Código da Sala:</label>
        <input type="text" id="room-code" placeholder="Ex: SALA123" style="text-transform: uppercase;" />
      </div>

      <div class="button-group" style="display: flex; gap: 10px; margin-top: 15px;">
        <button id="btn-create" onclick="createGame()" style="flex: 1; background: #be185d; color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">✨ Criar Sala</button>
        <button id="btn-join" onclick="joinGame()" style="flex: 1; background: #9d174d; color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">🚪 Entrar na Sala</button>
      </div>
    </div>
  </div>

  <!-- TELA DO JOGO -->
  <div id="game-screen" class="game-container" style="display: none;">
    
    <!-- PLACAR SUPERIOR -->
    <div class="top-bar">
      <div class="score-box">Trio A: <span id="score-a">0</span></div>
      <div class="score-box">Mão: <span id="hand-val">1 pt</span></div>
      <div class="score-box">Trio B: <span id="score-b">0</span></div>
      <div class="timer-box">⌛ <span id="timer">30</span>s</div>
    </div>

    <!-- MESA DO JOGO -->
    <div class="table">
      <!-- 6 Posicões das Jogadoras -->
      <div class="seat seat-0" id="seat-0">
        <div class="player-info" id="info-0">Vazio</div>
        <div class="cards-container" id="cards-0"></div>
      </div>

      <div class="seat seat-1" id="seat-1">
        <div class="player-info" id="info-1">Vazio</div>
        <div class="cards-container" id="cards-1"></div>
      </div>

      <div class="seat seat-2" id="seat-2">
        <div class="player-info" id="info-2">Vazio</div>
        <div class="cards-container" id="cards-2"></div>
      </div>

      <div class="seat seat-3" id="seat-3">
        <div class="player-info" id="info-3">Vazio</div>
        <div class="cards-container" id="cards-3"></div>
      </div>

      <div class="seat seat-4" id="seat-4">
        <div class="player-info" id="info-4">Vazio</div>
        <div class="cards-container" id="cards-4"></div>
      </div>

      <div class="seat seat-5" id="seat-5">
        <div class="player-info" id="info-5">Vazio</div>
        <div class="cards-container" id="cards-5"></div>
      </div>

      <!-- CENTRO DA MESA -->
      <div class="table-center">
        <div class="vira-container">
          <span>Vira:</span>
          <div id="vira-card-slot"></div>
        </div>
        <div class="center-mat" id="center-mat"></div>
      </div>
    </div>

    <!-- PAINEL DE AÇÕES E LOGS -->
    <div class="bottom-bar">
      <div class="action-buttons">
        <button onclick="askTruco()" class="btn-truco">TRUCO!</button>
        <button onclick="addBot()" class="btn-bot">+ Adicionar Bot</button>
        <button onclick="resetMesa()" class="btn-reset">Sair / Resetar Sala</button>
      </div>
      <div id="log" class="log-box">Aguardando jogadoras...</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
